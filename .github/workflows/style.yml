name: Code Style

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'veditor/locale/**'
      - 'veditor/static/**'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - 'veditor/locale/**'
      - 'veditor/static/**'

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Run pre-commit
      run: uv run pre-commit run --all-files
